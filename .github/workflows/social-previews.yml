name: Build social preview PNGs

on:
  push:
    branches: [main]
    paths:
      - 'assets/og-*.svg'
      - '.github/workflows/social-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG previews
        run: |
          for svg in assets/og-*.svg; do
            rsvg-convert -w 1200 -h 630 -o "${svg%.svg}.png" "$svg"
          done
      - name: Commit generated previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og-*.png
          if ! git diff --staged --quiet; then
            git commit -m "Render social preview PNGs"
            git push
          fi
